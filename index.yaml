    home: https://www.ibm.com/docs/en/b2b-integrator/6.2.0
    icon: https://raw.githubusercontent.com/IBM/charts/master/logo/ibm-b2bi-icon.png
    keywords:
    - b2bi
    - b2b
    - mft
    - sterling
